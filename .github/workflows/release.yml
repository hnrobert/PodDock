name: Release

# Tag-triggered packaging automation (modeled on MultiScreenCapturer, upgraded):
# - macOS app: Developer ID signing + notarization + staple, arm64 only
# - poddock-mcp: multi-arch Docker image pushed to GHCR
#
# Action versions verified on 2026-08-31: gh-release@v3 / login@v4 / metadata@v6 /
# buildx@v4 / build-push@v7.
#
# Required secrets (how to obtain each one: docs/DEVELOPMENT.md):
#   APPLE_CERTIFICATE_BASE64    — Developer ID Application certificate (.p12, base64)
#   APPLE_CERTIFICATE_PASSWORD  — password of that .p12
#   KEYCHAIN_PASSWORD           — password for the ephemeral CI keychain
#   APPLE_ID                    — Apple ID used for notarization
#   APPLE_APP_SPECIFIC_PASSWORD — app-specific password for that Apple ID
#   APPLE_TEAM_ID               — team ID (10 chars) for signing and notarytool
#
# Usage: bump MARKETING_VERSION, commit, then `git tag v0.x.y && git push --tags`.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  app:
    name: macOS app (Developer ID + notarized, arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTFILE=$(mktemp /tmp/certificate.XXXXXX.p12)
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERTFILE"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import "$CERTFILE" -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/xcodebuild
          security list-keychains -s build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f "$CERTFILE"

      - name: Archive and export app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild -project PodDock.xcodeproj -scheme PodDock \
            -configuration Release -destination "generic/platform=macOS" \
            -archivePath build/PodDock.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS="--options runtime" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            archive
          xcodebuild -exportArchive \
            -archivePath build/PodDock.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist .github/exportOptions.plist

      - name: Store notarytool credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool store-credentials PodDockNotary \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID"

      - name: Notarize and staple
        run: |
          APP="build/export/PodDock.app"
          ditto -c -k --keepParent "$APP" build/PodDock.zip
          # notarytool works on the zip; staple goes on the app bundle
          xcrun notarytool submit build/PodDock.zip --keychain-profile PodDockNotary --wait
          xcrun stapler staple "$APP"
          # re-zip the stapled bundle so the download is Gatekeeper-ready
          rm build/PodDock.zip
          ditto -c -k --keepParent "$APP" build/PodDock-macOS-arm64.zip

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: build/PodDock-macOS-arm64.zip
          draft: true
          generate_release_notes: true

  mcp-image:
    name: poddock-mcp Docker image (GHCR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/poddock-mcp
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # `latest` only on stable tags — prereleases carry a hyphen (v1.0.0-rc1);
            # github.event.release is empty on tag-push triggers
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Disable provenance to avoid unknown/unknown; same for sbom
          provenance: false
          sbom: false
