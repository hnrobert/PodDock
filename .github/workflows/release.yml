name: Release

# Tag-triggered packaging automation:
# - macOS app: signed with your Apple Development certificate via keychain import
#   (APPLE_CERTIFICATE_BASE64 / APPLE_CERTIFICATE_PASSWORD secrets), arm64 only.
#   NOT notarized — notarytool requires a paid Apple Developer Program account.
#   Recipients bypass Gatekeeper once (right-click → Open). Upgrade path in DEVELOPMENT.md.
# - poddock-mcp: multi-arch Docker image pushed to GHCR (no secrets — GITHUB_TOKEN).
#
# Action versions verified on 2026-08-31: gh-release@v3 / login@v4 / metadata@v6 /
# buildx@v4 / build-push@v7.
#
# Usage: bump MARKETING_VERSION, commit, then `git tag v0.x.y && git push --tags`.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  app:
    name: macOS app (certificate-signed zip, arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up signing
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTFILE=$(mktemp /tmp/certificate.XXXXXX.p12)
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERTFILE"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import "$CERTFILE" -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/xcodebuild
          security list-keychains -s build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f "$CERTFILE"

          # Fail fast with a readable message if the identity is unusable
          IDENTITIES=$(security find-identity -v -p codesigning build.keychain)
          echo "$IDENTITIES"
          if ! echo "$IDENTITIES" | grep -q "1 valid identities"; then
            echo "::error::No signing identity with a PRIVATE KEY was imported." \
              "The .p12 was probably exported without its private key." \
              "Re-export from Keychain Access → My Certificates, selecting BOTH the certificate AND the key (see DEVELOPMENT.md)."
            exit 1
          fi

          # Extract the team id from the imported identity (pbxproj has none baked in)
          TEAM_ID=$(echo "$IDENTITIES" | grep -oE '\(([A-Z0-9]{10})\)' | head -1 | tr -d '()')
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"

      - name: Build and archive app
        run: |
          xcodebuild -project PodDock.xcodeproj -scheme PodDock \
            -configuration Release -destination "generic/platform=macOS" \
            -archivePath build/PodDock.xcarchive \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Development" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            archive

      - name: Package
        run: |
          # ditto (not zip) preserves symlinks and bundle structure
          ditto -c -k --keepParent \
            "build/PodDock.xcarchive/Products/Applications/PodDock.app" \
            PodDock-macOS-arm64.zip

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: PodDock-macOS-arm64.zip
          draft: true
          generate_release_notes: true
          body: |
            macOS (Apple Silicon), signed with an Apple Development certificate — not notarized.
            On first launch macOS will block it: right-click the app → **Open** → **Open**,
            or run `xattr -d com.apple.quarantine /Applications/PodDock.app`.

  mcp-image:
    name: poddock-mcp Docker image (GHCR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/poddock-mcp
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # `latest` only on stable tags — prereleases carry a hyphen (v1.0.0-rc1);
            # github.event.release is empty on tag-push triggers
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Disable provenance to avoid unknown/unknown; same for sbom
          provenance: false
          sbom: false
