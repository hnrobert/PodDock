name: Release

# Tag-triggered release pipeline:
# - setup: version from the tag + generated release notes (commit list + compare link)
# - build: import the Apple Development certificate (secret flow), archive Release,
#   zip the .app with a versioned name, publish a non-draft GitHub Release.
#   The archive itself stays ad-hoc on macOS (identity baked into the pbxproj) —
#   free personal-team accounts have no distribution profile, and Gatekeeper is
#   friendlier to ad-hoc downloads ("Open Anyway") than to Apple-Development-signed
#   ones ("damaged, move to Trash"). The cert import keeps the pipeline ready to
#   switch to a real Developer ID identity later.
# - mcp-image: linux/amd64 Docker image pushed to GHCR (built-in GITHUB_TOKEN).
#
# Action versions verified on 2026-09-05: checkout@v7 / setup-xcode@v1 /
# gh-release@v3 / login@v4 / metadata@v6 / buildx@v4 / build-push@v7.
#
# Usage: bump MARKETING_VERSION, commit, then `git tag v0.x.y && git push --tags`.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  setup:
    name: Version + release notes
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      release_notes: ${{ steps.release_notes.outputs.NOTES }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: release_notes
        run: |
          CURRENT_TAG=${GITHUB_REF#refs/tags/}
          LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s" --no-merges)
            COMPARE_LINK="https://github.com/${{ github.repository }}/commits/${CURRENT_TAG}"
          else
            COMMITS=$(git log ${LAST_TAG}..HEAD --pretty=format:"- %s" --no-merges)
            COMPARE_LINK="https://github.com/${{ github.repository }}/compare/${LAST_TAG}...${CURRENT_TAG}"
          fi

          echo "NOTES<<EOF" >> $GITHUB_OUTPUT
          echo "## Release ${CURRENT_TAG}" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "Changes in this release:" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "---" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "### First launch (Gatekeeper)" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "macOS (Apple Silicon), ad-hoc signed — not notarized. On macOS 15+" >> $GITHUB_OUTPUT
          echo "right-click → Open no longer works; after the first blocked launch open" >> $GITHUB_OUTPUT
          echo "**System Settings → Privacy & Security** and click **Open Anyway** (仍要打开)," >> $GITHUB_OUTPUT
          echo "or run \`xattr -dr com.apple.quarantine ~/Downloads/PodDock.app\`." >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "See full changelogs: [${LAST_TAG}...${CURRENT_TAG}](${COMPARE_LINK})" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  build:
    name: macOS app (zip, arm64)
    needs: setup
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # App icon PNGs are generated, not committed (see scripts/ and .gitignore)
      - name: Generate app icons
        run: swift scripts/generate-app-icons.swift

      - name: Set up signing
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > certificate.p12
          security create-keychain -p "" build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -s build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          rm -f certificate.p12

      - name: Build and Archive App
        run: |
          xcodebuild clean archive \
            -project PodDock.xcodeproj \
            -scheme PodDock \
            -configuration Release \
            -archivePath ./build/PodDock.xcarchive \
            -destination 'generic/platform=macOS' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES

      - name: Create App Bundle
        run: |
          mkdir -p ./artifacts
          cp -r "./build/PodDock.xcarchive/Products/Applications/PodDock.app" ./artifacts/
          codesign --verify --deep --strict --verbose=2 ./artifacts/PodDock.app
          cd artifacts
          zip -r ../PodDock-v${{ needs.setup.outputs.version }}-macOS.zip .
          cd ..

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: PodDock-v${{ needs.setup.outputs.version }}-macOS.zip
          draft: false
          prerelease: false
          generate_release_notes: false
          body: ${{ needs.setup.outputs.release_notes }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mcp-image:
    name: poddock-mcp Docker image (GHCR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/poddock-mcp
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # `latest` only on stable tags — prereleases carry a hyphen (v1.0.0-rc1);
            # github.event.release is empty on tag-push triggers
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Disable provenance to avoid unknown/unknown; same for sbom
          provenance: false
          sbom: false
