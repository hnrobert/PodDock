name: Release

# Tag-triggered release pipeline:
# - build: import the Apple Development certificate (secret flow), archive Release,
#   zip the .app with a versioned name, attach the zip to the tag's GitHub Release.
#   The workflow never touches release content (title/body/notes) — it only adds
#   files; edit the release itself in the GitHub UI.
#   The archive itself stays ad-hoc on macOS (identity baked into the pbxproj) —
#   free personal-team accounts have no distribution profile, and Gatekeeper is
#   friendlier to ad-hoc downloads ("Open Anyway") than to Apple-Development-signed
#   ones ("damaged, move to Trash"). The cert import keeps the pipeline ready to
#   switch to a real Developer ID identity later.
# - mcp-image: linux/amd64 Docker image pushed to GHCR (built-in GITHUB_TOKEN).
#
# Action versions verified on 2026-09-05: checkout@v7 / setup-xcode@v1 /
# gh-release@v3 / login@v4 / metadata@v6 / buildx@v4 / build-push@v7.
#
# Usage: bump MARKETING_VERSION, commit, then `git tag v0.x.y && git push --tags`.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: macOS app (zip, arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # App icon PNGs are generated, not committed (see scripts/ and .gitignore)
      - name: Generate app icons
        run: swift scripts/generate-app-icons.swift

      - name: Set up signing
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > certificate.p12
          security create-keychain -p "" build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -s build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          rm -f certificate.p12

      - name: Build and Archive App
        run: |
          xcodebuild clean archive \
            -project PodDock.xcodeproj \
            -scheme PodDock \
            -configuration Release \
            -archivePath ./build/PodDock.xcarchive \
            -destination 'generic/platform=macOS' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES

      - name: Create App Bundle
        run: |
          mkdir -p ./artifacts
          cp -r "./build/PodDock.xcarchive/Products/Applications/PodDock.app" ./artifacts/
          codesign --verify --deep --strict --verbose=2 ./artifacts/PodDock.app
          cd artifacts
          zip -r ../PodDock-v${{ steps.version.outputs.VERSION }}-macOS.zip .
          cd ..

      # Attach-only: creates the release with an empty body if the tag has none,
      # otherwise just uploads files — never touches title/body/notes.
      - name: Attach files to release
        uses: softprops/action-gh-release@v3
        with:
          files: PodDock-v${{ steps.version.outputs.VERSION }}-macOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mcp-image:
    name: poddock-mcp Docker image (GHCR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/poddock-mcp
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # `latest` only on stable tags — prereleases carry a hyphen (v1.0.0-rc1);
            # github.event.release is empty on tag-push triggers
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Disable provenance to avoid unknown/unknown; same for sbom
          provenance: false
          sbom: false
