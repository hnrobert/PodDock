name: CI

# Action versions verified on 2026-09-04: checkout@v7 / setup-xcode@v1
# The linux job runs in the swift:6.1-jammy container (same toolchain as the
# Dockerfile) — no setup-swift action needed, which also sidesteps its node20
# deprecation warning on GitHub runners.
on:
  push:
    branches: [main]
    paths:
      - "DNSPodKit/**"
      - "PodDock/**"
      - "PodDock.xcodeproj/**"
      - "Config/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "DNSPodKit/**"
      - "PodDock/**"
      - "PodDock.xcodeproj/**"
      - "Config/**"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    name: macOS (app build on both platforms + Kit tests)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build app (macOS)
        run: |
          xcodebuild -project PodDock.xcodeproj -scheme PodDock \
            -destination "platform=macOS" build \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Build app (iOS Simulator)
        run: |
          xcodebuild -project PodDock.xcodeproj -scheme PodDock \
            -destination "generic/platform=iOS Simulator" build \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: SwiftPM tests (DNSPodKit)
        working-directory: DNSPodKit
        run: swift test

  linux:
    name: Linux purity (Kit tests + poddock-mcp build)
    runs-on: ubuntu-latest
    container: swift:6.1-jammy
    steps:
      - uses: actions/checkout@v7

      - name: SwiftPM tests
        working-directory: DNSPodKit
        run: swift test

      - name: Build poddock-mcp
        working-directory: DNSPodKit
        run: swift build --product poddock-mcp
