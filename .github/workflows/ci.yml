name: CI

# action 版本核查于 2026-08-30:checkout@v7 / setup-xcode@v1 / setup-swift@v2
on:
  push:
    branches: [main]
    paths:
      - "DNSPodKit/**"
      - "PodDock/**"
      - "PodDock.xcodeproj/**"
      - "Config/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "DNSPodKit/**"
      - "PodDock/**"
      - "PodDock.xcodeproj/**"
      - "Config/**"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    name: macOS (App 双平台 build + Kit 测试)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build app (macOS)
        run: |
          xcodebuild -project PodDock.xcodeproj -scheme PodDock \
            -destination "platform=macOS" build \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Build app (iOS Simulator)
        run: |
          xcodebuild -project PodDock.xcodeproj -scheme PodDock \
            -destination "generic/platform=iOS Simulator" build \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: SwiftPM tests (DNSPodKit)
        working-directory: DNSPodKit
        run: swift test

  linux:
    name: Linux 纯净性 (Kit 测试 + poddock-mcp 构建)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"

      - name: SwiftPM tests
        working-directory: DNSPodKit
        run: swift test

      - name: Build poddock-mcp
        working-directory: DNSPodKit
        run: swift build --product poddock-mcp
